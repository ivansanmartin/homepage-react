replicaCount: 2

image:
  repository: 192.168.1.200:30002/ivansanmartin/homepage
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: "homepage"
fullnameOverride: "homepage"

namespace: ivansanmartin

resources:
  limits:
    cpu: 200m
    memory: 64Mi
  requests:
    cpu: 100m
    memory: 32Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: ivansanmartin.dev
  path: /
  pathType: ImplementationSpecific

securityContext:
  runAsUser: 0

labels:
  app: homepage-label