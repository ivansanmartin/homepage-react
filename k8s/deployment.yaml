apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage-deployment
  namespace: ivansanmartin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage-label
  template:
    metadata:
      labels:
        app: homepage-label
    spec:
      containers:
        - name: homepage
          image: homepage:teddy
          imagePullPolicy: IfNotPresent